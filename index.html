<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JEE Exam Sprint</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .code-font { font-family: monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-10">

    <!-- Top Mobile Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="flex items-center justify-between mb-2">
            <h1 class="text-base font-bold text-blue-400 flex items-center gap-1.5">
                ⚡ JEE Battle Sprint
            </h1>
            <span id="sync-status" class="text-xs text-amber-400 font-semibold flex items-center gap-1">
                <i class="fa-solid fa-spinner fa-spin"></i> Connecting...
            </span>
        </div>

        <!-- Saturday 8 AM Countdown Banner -->
        <div class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/30 rounded-xl p-2.5 mb-2 text-center">
            <div class="text-[10px] uppercase font-bold text-indigo-300 tracking-wider">🎯 Saturday Exam Target (08:00 AM)</div>
            <div id="exam-timer" class="text-sm font-black text-amber-400 code-font mt-0.5">Calculating...</div>
        </div>

        <div class="flex items-center justify-between gap-2 bg-slate-800 p-2 rounded-xl text-xs">
            <div class="flex items-center gap-1 overflow-hidden">
                <span class="text-slate-400">Room:</span>
                <span id="room-id-display" class="font-bold text-amber-400 code-font truncate max-w-[90px]">...</span>
                <button onclick="changeRoom()" class="text-slate-400 hover:text-white ml-1">
                    <i class="fa-solid fa-pen"></i>
                </button>
            </div>
            <div class="flex gap-1">
                <button onclick="createNewRoom()" class="bg-slate-700 text-slate-200 px-2 py-1 rounded-lg font-bold">
                    <i class="fa-solid fa-plus"></i> New
                </button>
                <button onclick="shareRoomLink()" class="bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold flex items-center gap-1">
                    <i class="fa-solid fa-share-nodes"></i> Share
                </button>
            </div>
        </div>
    </header>

    <main class="p-4 space-y-4 max-w-lg mx-auto">

        <!-- Live Players / Progress Cards -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-users text-amber-400"></i> Room Participants
            </h2>

            <!-- My Card -->
            <div class="bg-slate-800/80 border-2 border-blue-500 rounded-xl p-3">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-bold text-blue-400">YOU (Your Device)</span>
                    <span id="my-xp" class="text-lg font-black text-white code-font">0 XP</span>
                </div>
                <div class="text-xs text-slate-400 flex justify-between">
                    <span>Tasks: <b id="my-tasks-count" class="text-slate-200">0/0</b></span>
                    <span>Qs: <b id="my-qs-count" class="text-emerald-400">0</b></span>
                </div>
            </div>

            <!-- Opponent / Friend Card -->
            <div id="opponent-container">
                <div class="bg-slate-800/40 border border-dashed border-slate-700 rounded-xl p-3 text-center text-xs text-slate-500">
                    <i class="fa-solid fa-user-clock text-lg mb-1 block"></i>
                    Waiting for 2nd player to open room link...
                </div>
            </div>
        </div>

        <!-- Question Logger -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
            <h3 class="text-xs font-bold text-slate-300 uppercase mb-3 flex items-center gap-2">
                <i class="fa-solid fa-calculator text-emerald-400"></i> Log Solved Questions (+10 XP)
            </h3>
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-slate-800 p-2.5 rounded-xl text-center">
                    <div class="text-[10px] font-bold text-blue-400 uppercase">Maths</div>
                    <div id="q-maths-count" class="text-base font-bold code-font my-1">0</div>
                    <div class="flex gap-1">
                        <button onclick="addQ('maths', -1)" class="flex-1 bg-slate-700 text-xs py-1 rounded font-bold">-</button>
                        <button onclick="addQ('maths', 1)" class="flex-1 bg-blue-600 text-xs py-1 rounded font-bold">+</button>
                    </div>
                </div>
                <div class="bg-slate-800 p-2.5 rounded-xl text-center">
                    <div class="text-[10px] font-bold text-indigo-400 uppercase">Physics</div>
                    <div id="q-physics-count" class="text-base font-bold code-font my-1">0</div>
                    <div class="flex gap-1">
                        <button onclick="addQ('physics', -1)" class="flex-1 bg-slate-700 text-xs py-1 rounded font-bold">-</button>
                        <button onclick="addQ('physics', 1)" class="flex-1 bg-indigo-600 text-xs py-1 rounded font-bold">+</button>
                    </div>
                </div>
                <div class="bg-slate-800 p-2.5 rounded-xl text-center">
                    <div class="text-[10px] font-bold text-purple-400 uppercase">Chem</div>
                    <div id="q-chem-count" class="text-base font-bold code-font my-1">0</div>
                    <div class="flex gap-1">
                        <button onclick="addQ('chem', -1)" class="flex-1 bg-slate-700 text-xs py-1 rounded font-bold">-</button>
                        <button onclick="addQ('chem', 1)" class="flex-1 bg-purple-600 text-xs py-1 rounded font-bold">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Days Selector Header -->
        <div class="flex items-center justify-between">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Schedule & Tasks</h3>
            <button onclick="openAddTaskModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Add Block
            </button>
        </div>

        <!-- Days Selector -->
        <div class="flex bg-slate-900 p-1.5 rounded-xl border border-slate-800 gap-1 text-center">
            <button id="tab-today" onclick="switchTab('today')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-blue-600 text-white">Today Sprint</button>
            <button id="tab-fri" onclick="switchTab('fri')" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-400">Friday</button>
            <button id="tab-sat" onclick="switchTab('sat')" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-400">Saturday (Exam Day)</button>
        </div>

        <!-- Task Checklist -->
        <div id="tasks-list" class="space-y-2"></div>

    </main>

    <!-- Modal: Add / Edit Task -->
    <div id="task-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 w-full max-w-sm space-y-3">
            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-sm font-bold text-white">Add Schedule Block</h3>
                <button onclick="closeTaskModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <input type="hidden" id="task-edit-id">

            <div>
                <label class="text-[10px] font-bold uppercase text-slate-400">Chapter / Task Name</label>
                <input type="text" id="task-title-input" placeholder="e.g. Maths: Integration PYQs" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500 mt-1">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400">Time / Duration</label>
                    <input type="text" id="task-time-input" placeholder="06:00 PM – 08:00 PM" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500 mt-1">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400">XP Reward</label>
                    <input type="number" id="task-xp-input" value="250" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500 mt-1">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold uppercase text-slate-400">Assign Day</label>
                <select id="task-day-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500 mt-1">
                    <option value="today">Today Sprint</option>
                    <option value="fri">Friday</option>
                    <option value="sat">Saturday (Exam Day)</option>
                </select>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveTaskModal()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-2.5 rounded-xl">Save Block</button>
                <button id="delete-task-btn" onclick="deleteTaskFromModal()" class="bg-rose-900/50 border border-rose-600 text-rose-300 font-bold text-xs px-3 py-2.5 rounded-xl hidden">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAf7gaZu52OpJXRZoOFV-RBsw-EKdW7lqQ",
          authDomain: "lets-85076.firebaseapp.com",
          databaseURL: "https://lets-85076-default-rtdb.firebaseio.com",
          projectId: "lets-85076",
          storageBucket: "lets-85076.firebasestorage.app",
          messagingSenderId: "183210284372",
          appId: "1:183210284372:web:a1dced56c89689e6b464c1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // DEFAULT TASK DATABASE
        const defaultTasks = [
            { id: "td_1", day: "today", time: "08:00 AM – 05:00 PM", title: "Coaching Classes: Active Notes & High-Yield Capture", xp: 300 },
            { id: "td_2", day: "today", time: "06:00 PM – 08:30 PM", title: "Maths High-Yield PYQ Sprint (Calculus/Algebra)", xp: 250 },
            { id: "td_3", day: "today", time: "09:00 PM – 11:15 PM", title: "Physics & Organic Chemistry Practice Drills", xp: 250 },

            { id: "fri_1", day: "fri", time: "06:00 AM – 07:30 AM", title: "Morning Memory Recall: Inorganic / Organic Formulas", xp: 180 },
            { id: "fri_2", day: "fri", time: "08:00 AM – 05:00 PM", title: "Coaching Classes: High-Priority Doubt Resolution", xp: 300 },
            { id: "fri_3", day: "fri", time: "06:00 PM – 08:15 PM", title: "Maths High-Yield Problem Solving Session", xp: 250 },
            { id: "fri_4", day: "fri", time: "09:00 PM – 11:00 PM", title: "Pre-Exam Formula & High-Frequency Error Log Scan", xp: 250 },

            { id: "sat_1", day: "sat", time: "06:00 AM – 07:30 AM", title: "Quick Mind Warmup: Formula Sheet & Key Reactions", xp: 200 },
            { id: "sat_2", day: "sat", time: "08:00 AM – 11:00 AM", title: "🎯 JEE MAJOR TEST ATTEMPT (08:00 AM)", xp: 500 },
            { id: "sat_3", day: "sat", time: "11:30 AM – 01:00 PM", title: "Post-Exam Quick Error & Score Analysis", xp: 250 }
        ];

        let taskDatabase = JSON.parse(localStorage.getItem('jee_custom_tasks')) || defaultTasks;

        let myUserId = localStorage.getItem('jee_my_user_id');
        if (!myUserId) {
            myUserId = 'user_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('jee_my_user_id', myUserId);
        }

        const urlParams = new URLSearchParams(window.location.search);
        let roomID = urlParams.get('room') || localStorage.getItem('jee_room_id') || 'jee-battle-1';
        localStorage.setItem('jee_room_id', roomID);

        let currentTab = 'today';
        let myData = { completedTasks: {}, questions: { maths: 0, physics: 0, chem: 0 } };
        let roomPlayers = {};

        window.onload = function() {
            document.getElementById('room-id-display').innerText = roomID;
            loadLocalMyData();
            renderTasks();
            setupFirebaseSync();
            startCountdownTimer();
        };

        function saveTaskDatabase() {
            localStorage.setItem('jee_custom_tasks', JSON.stringify(taskDatabase));
            db.ref(`rooms/${roomID}/sharedTasks`).set(taskDatabase);
        }

        function setupFirebaseSync() {
            const roomRef = db.ref(`rooms/${roomID}`);

            const fallbackTimeout = setTimeout(() => {
                document.getElementById('sync-status').className = "text-xs text-amber-400 font-semibold flex items-center gap-1";
                document.getElementById('sync-status').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Local Mode`;
            }, 3000);

            roomRef.on('value', (snapshot) => {
                clearTimeout(fallbackTimeout);
                const val = snapshot.val() || {};
                roomPlayers = val.players || {};
                
                if (val.sharedTasks) {
                    taskDatabase = val.sharedTasks;
                    localStorage.setItem('jee_custom_tasks', JSON.stringify(taskDatabase));
                }

                if (roomPlayers[myUserId]) {
                    myData = roomPlayers[myUserId];
                    saveLocalMyData();
                } else {
                    pushMyData();
                }

                updateUI();
                document.getElementById('sync-status').className = "text-xs text-emerald-400 font-semibold flex items-center gap-1";
                document.getElementById('sync-status').innerHTML = `<i class="fa-solid fa-cloud"></i> Live`;
            }, (err) => {
                clearTimeout(fallbackTimeout);
                document.getElementById('sync-status').className = "text-xs text-amber-400 font-semibold flex items-center gap-1";
                document.getElementById('sync-status').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Local Mode`;
            });
        }

        function pushMyData() {
            db.ref(`rooms/${roomID}/players/${myUserId}`).set(myData);
        }

        function saveLocalMyData() {
            localStorage.setItem(`jee_data_${roomID}`, JSON.stringify(myData));
        }

        function loadLocalMyData() {
            const saved = localStorage.getItem(`jee_data_${roomID}`);
            if (saved) {
                try { myData = JSON.parse(saved); } catch (e) {}
            }
        }

        function calculateXP(data) {
            let xp = 0;
            let tasks = 0;
            const completed = data.completedTasks || {};
            taskDatabase.forEach(t => {
                if (completed[t.id]) {
                    xp += Number(t.xp || 0);
                    tasks++;
                }
            });
            const q = data.questions || { maths: 0, physics: 0, chem: 0 };
            const qTotal = (q.maths || 0) + (q.physics || 0) + (q.chem || 0);
            xp += (qTotal * 10);
            return { xp, tasks, qTotal };
        }

        function updateUI() {
            const myStats = calculateXP(myData);
            document.getElementById('my-xp').innerText = `${myStats.xp} XP`;
            document.getElementById('my-tasks-count').innerText = `${myStats.tasks}/${taskDatabase.length}`;
            document.getElementById('my-qs-count').innerText = myStats.qTotal;

            document.getElementById('q-maths-count').innerText = myData.questions?.maths || 0;
            document.getElementById('q-physics-count').innerText = myData.questions?.physics || 0;
            document.getElementById('q-chem-count').innerText = myData.questions?.chem || 0;

            const opponentContainer = document.getElementById('opponent-container');
            const otherUserIds = Object.keys(roomPlayers).filter(id => id !== myUserId);

            if (otherUserIds.length > 0) {
                const opponentId = otherUserIds[0];
                const oppData = roomPlayers[opponentId];
                const oppStats = calculateXP(oppData);

                opponentContainer.innerHTML = `
                    <div class="bg-purple-950/40 border-2 border-purple-500 rounded-xl p-3">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-purple-400">FRIEND / OPPONENT</span>
                            <span class="text-lg font-black text-white code-font">${oppStats.xp} XP</span>
                        </div>
                        <div class="text-xs text-slate-400 flex justify-between">
                            <span>Tasks: <b class="text-slate-200">${oppStats.tasks}/${taskDatabase.length}</b></span>
                            <span>Qs: <b class="text-emerald-400">${oppStats.qTotal}</b></span>
                        </div>
                    </div>
                `;
            } else {
                opponentContainer.innerHTML = `
                    <div class="bg-slate-800/40 border border-dashed border-slate-700 rounded-xl p-3 text-center text-xs text-slate-500">
                        <i class="fa-solid fa-user-clock text-lg mb-1 block"></i>
                        Waiting for 2nd player to join room "${roomID}"...
                    </div>
                `;
            }

            renderTasks();
        }

        function toggleTask(taskId) {
            if (!myData.completedTasks) myData.completedTasks = {};
            if (myData.completedTasks[taskId]) {
                delete myData.completedTasks[taskId];
            } else {
                myData.completedTasks[taskId] = true;
            }
            saveLocalMyData();
            pushMyData();
            updateUI();
        }

        function addQ(subject, amount) {
            if (!myData.questions) myData.questions = { maths: 0, physics: 0, chem: 0 };
            const curr = myData.questions[subject] || 0;
            myData.questions[subject] = Math.max(0, curr + amount);
            saveLocalMyData();
            pushMyData();
            updateUI();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['today', 'fri', 'sat'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab 
                    ? "flex-1 py-2 rounded-lg text-xs font-bold bg-blue-600 text-white" 
                    : "flex-1 py-2 rounded-lg text-xs font-bold text-slate-400";
            });
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = '';
            const filtered = taskDatabase.filter(t => t.day === currentTab);

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center text-xs text-slate-500">
                        No blocks added for this day. Click <b>+ Add Block</b> to add one!
                    </div>
                `;
                return;
            }

            filtered.forEach(t => {
                const isChecked = !!(myData.completedTasks && myData.completedTasks[t.id]);
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border flex items-center justify-between transition-all ${isChecked ? 'bg-slate-900/60 border-emerald-500/50' : 'bg-slate-900 border-slate-800'}`;
                card.innerHTML = `
                    <div class="flex items-center gap-3 pr-2 flex-1 cursor-pointer" onclick="toggleTask('${t.id}')">
                        <div class="w-5 h-5 rounded border flex items-center justify-center ${isChecked ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-600'}">
                            <i class="fa-solid fa-check text-xs ${isChecked ? '' : 'hidden'}"></i>
                        </div>
                        <div>
                            <div class="text-[10px] text-slate-400 code-font">${t.time}</div>
                            <div class="text-xs font-bold ${isChecked ? 'line-through text-slate-400' : 'text-slate-100'}">${t.title}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-amber-400 code-font">+${t.xp}XP</span>
                        <button onclick="openEditTaskModal('${t.id}')" class="text-slate-500 hover:text-slate-300 p-1">
                            <i class="fa-solid fa-pen-to-square text-xs"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // Modal Logic
        function openAddTaskModal() {
            document.getElementById('modal-title').innerText = "Add Schedule Block";
            document.getElementById('task-edit-id').value = "";
            document.getElementById('task-title-input').value = "";
            document.getElementById('task-time-input').value = "06:00 PM – 08:00 PM";
            document.getElementById('task-xp-input').value = "250";
            document.getElementById('task-day-select').value = currentTab;
            document.getElementById('delete-task-btn').classList.add('hidden');
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function openEditTaskModal(id) {
            const task = taskDatabase.find(t => t.id === id);
            if (!task) return;

            document.getElementById('modal-title').innerText = "Edit Block";
            document.getElementById('task-edit-id').value = task.id;
            document.getElementById('task-title-input').value = task.title;
            document.getElementById('task-time-input').value = task.time;
            document.getElementById('task-xp-input').value = task.xp;
            document.getElementById('task-day-select').value = task.day;
            document.getElementById('delete-task-btn').classList.remove('hidden');
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function saveTaskModal() {
            const id = document.getElementById('task-edit-id').value;
            const title = document.getElementById('task-title-input').value.trim();
            const time = document.getElementById('task-time-input').value.trim();
            const xp = parseInt(document.getElementById('task-xp-input').value) || 100;
            const day = document.getElementById('task-day-select').value;

            if (!title) {
                alert("Please enter a title for the block.");
                return;
            }

            if (id) {
                // Edit existing
                const task = taskDatabase.find(t => t.id === id);
                if (task) {
                    task.title = title;
                    task.time = time;
                    task.xp = xp;
                    task.day = day;
                }
            } else {
                // Add new
                const newTask = {
                    id: 'custom_' + Math.random().toString(36).substr(2, 6),
                    day: day,
                    time: time,
                    title: title,
                    xp: xp
                };
                taskDatabase.push(newTask);
            }

            saveTaskDatabase();
            updateUI();
            closeTaskModal();
        }

        function deleteTaskFromModal() {
            const id = document.getElementById('task-edit-id').value;
            if (!id) return;

            if (confirm("Are you sure you want to delete this block?")) {
                taskDatabase = taskDatabase.filter(t => t.id !== id);
                if (myData.completedTasks && myData.completedTasks[id]) {
                    delete myData.completedTasks[id];
                    saveLocalMyData();
                    pushMyData();
                }
                saveTaskDatabase();
                updateUI();
                closeTaskModal();
            }
        }

        function createNewRoom() {
            const randomCode = 'room-' + Math.random().toString(36).substr(2, 5);
            switchRoom(randomCode);
        }

        function changeRoom() {
            const key = prompt("Enter Room Key:", roomID);
            if (key && key.trim() !== '') {
                switchRoom(key.trim());
            }
        }

        function switchRoom(newRoomId) {
            db.ref(`rooms/${roomID}`).off();
            roomID = newRoomId;
            localStorage.setItem('jee_room_id', roomID);
            
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomID;
            window.history.pushState({path: newUrl}, '', newUrl);

            document.getElementById('room-id-display').innerText = roomID;
            loadLocalMyData();
            setupFirebaseSync();
        }

        function shareRoomLink() {
            const shareableUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomID;
            const shareText = `Join my JEE Sprint room! Live progress link: ${shareableUrl}`;

            if (navigator.share) {
                navigator.share({
                    title: 'JEE Battle Sprint',
                    text: shareText,
                    url: shareableUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareableUrl);
                alert("Room link copied to clipboard! Send it to your friend on WhatsApp.");
            }
        }

        // Live Countdown Clock to Saturday 8:00 AM
        function startCountdownTimer() {
            function updateTimer() {
                const now = new Date();
                let testDate = new Date();
                
                const dayOfWeek = now.getDay();
                let daysUntilSat = (6 - dayOfWeek + 7) % 7;
                if (daysUntilSat === 0 && now.getHours() >= 8) {
                    daysUntilSat = 7;
                }
                
                testDate.setDate(now.getDate() + daysUntilSat);
                testDate.setHours(8, 0, 0, 0);

                const diff = testDate - now;

                if (diff <= 0) {
                    document.getElementById('exam-timer').innerText = "EXAM IS LIVE NOW!";
                    return;
                }

                const hrs = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('exam-timer').innerText = `${hrs}h ${mins}m ${secs}s REMAINING`;
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }
    </script>
